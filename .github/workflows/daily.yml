name: Daily breadth and website
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crypto-breadth-publication
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculation
        run: node --test math.test.mjs
      - name: Verify configured data access
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: node verify-provider.mjs
      - name: Collect daily data
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: node update.mjs
      - name: Preserve observations and membership
        run: |
          git config user.name "crypto-breadth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily crypto breadth"
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html style.css app.js math.mjs data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
